title = "MAX export: default detection with narrowly scoped design metadata exceptions"
[extend]
useDefault = true

[[allowlists]]
description = "Installed dependencies and disposable local workspace are not published"
paths = ['''(^|/)node_modules/''', '''(^|/)artifacts/workspace/''']

[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Figma node/component hashes and manifest SHA digests, not credentials"
condition = "AND"
paths = ['''(^|/)(figma\.json|export\.json(?:\.[a-f0-9-]+\.tmp)?|.*manifest\.json|build\.json|source\.json|.*apply-result\.json|max-review\.json)$''']
regexTarget = "secret"
regexes = ['''^[a-fA-F0-9]{10,64}$''']
[[rules.allowlists]]
description = "Figma document and selection identifiers are public resource identifiers"
regexTarget = "match"
regexes = ['''(?i)^(file_?Key|selectionKey)["']?\s*:\s*["'][a-zA-Z0-9:_/-]+["']$''']

[[rules.allowlists]]
description = "KDW build-input SHA-256 values, verified against the packaged source"
condition = "AND"
paths = ['''(^|/)kdw-max/apps/max-game/(source/history/r8-before-oct07|www/webgl-v5)/r[89]-build\.json$''']
regexTarget = "secret"
regexes = ['''^[a-f0-9]{64}$''']

[[rules.allowlists]]
description = "Exact source SHA256 for local-player-auth.mjs in two verified Figma provenance records"
condition = "AND"
paths = ['''(^|/)kdw-max/UI/figma-plugins/max-current-screens/(source/final-provenance|content-index)\.json$''']
regexTarget = "secret"
regexes = ['''^436837a8a29c2ef74c50bc8df1ec3fba3cc338c6e83109f531c985f10d4359dc$''']
