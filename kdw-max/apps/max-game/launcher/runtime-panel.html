<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Состояние приложения</title><style>body{background:#100b21;color:#eee;font:18px system-ui;max-width:1000px;margin:40px auto;padding:20px}button,a{font:inherit;padding:12px;color:#fff;background:#44318d;border:0;border-radius:12px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#211735;padding:20px;border-radius:16px}nav{display:flex;gap:12px;flex-wrap:wrap}#notice{min-height:30px;color:#9ee3ff}</style><h1>Состояние и восстановление</h1><p>Перезапуск вывода сохраняет данные игры. После восстановления MAX автоматически принимает касания лидара.</p><nav><button data-action="restart-output">Восстановить вывод</button><button data-action="restart-api">Перезапустить API</button><button id="download">Скачать диагностику</button><button data-action="stop">Остановить приложение</button></nav><p id="notice"></p><pre id="state">Подключение…</pre><script>
const notice=document.querySelector('#notice');async function refresh(){try{const r=await fetch('./state');if(!r.ok)throw Error('API недоступен');const s=await r.json();document.querySelector('#state').textContent=JSON.stringify(s,null,2);}catch(e){notice.textContent='Нет связи. Откройте резервную панель supervisor на локальном порту приложения + 100.';}}document.querySelectorAll('[data-action]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{const r=await fetch('./'+b.dataset.action,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}),v=await r.json();if(!r.ok)throw Error(v.error);notice.textContent='Команда принята';await refresh();}catch(e){notice.textContent=e.message;}finally{b.disabled=false;}});document.querySelector('#download').onclick=async()=>{try{const r=await fetch('./diagnostics');if(!r.ok)throw Error('Не удалось получить диагностику');const blob=new Blob([JSON.stringify(await r.json(),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='runtime-diagnostics.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}catch(e){notice.textContent=e.message;}};refresh();setInterval(refresh,2000);
</script></html>
